    - " <gray>- <white>Sells all items from it's container."
    - ""
    - "<#CC00FF>Statistics"
    - " <#CC00FF>❙ <white>Level: <#FFEEAA><level>"
    - " <#CC00FF>❙ <white>Items sold: <#FFEEAA><actions>"
